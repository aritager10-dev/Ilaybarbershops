<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/fonts/heebo.css" />
<title>הסרה מדיוור | Ilay Barbershop</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1d1d1f;font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid #d2d2d7;padding:14px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700}
a{color:#0050b3;text-decoration:underline;text-underline-offset:3px}
a:hover{color:#003a80}
a:focus-visible{outline:3px solid #0050b3;outline-offset:3px;border-radius:3px}
main{padding:28px 0 40px}
h1{font-size:1.9rem;line-height:1.3;margin:0 0 6px}
p{margin:.5rem 0}
button{display:block;width:100%;max-width:320px;min-height:48px;margin:1.25rem 0;border:0;border-radius:12px;background:#0050b3;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#003a80}
button:focus-visible{outline:3px solid #0050b3;outline-offset:3px}
button[disabled]{opacity:.65;cursor:wait}
#result:empty{display:none}
#result{margin:1.25rem 0;padding:12px 14px;border-radius:12px;background:#f5f5f7}
footer{border-top:1px solid #d2d2d7;padding:18px 0 30px;font-size:.95rem;color:#4a4a4f}
footer a{margin-inline-end:14px}
@media (max-width:480px){body{font-size:16px}h1{font-size:1.6rem}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">Ilay Barbershop</span><a href="/">חזרה לאתר</a></div></header>
<main class="wrap">
<h1>הסרה מדיוור</h1>
<p id="intro">לחיצה על הכפתור מפסיקה את הודעות הפרסום מ-Ilay Barbershop למספר שאליו נשלח הקישור. לא צריך להתחבר. הודעות על תורים שקבעת ימשיכו להגיע.</p>
<button type="button" id="optOutBtn">הסרה מדיוור</button>
<p id="result" role="status" aria-live="polite"></p>
<p>אפשר גם להשיב "הסר" להודעה, או להתקשר ל-<a href="tel:0542858711">054-2858711</a>.</p>
</main>
<footer><div class="wrap"><nav aria-label="עמודים משפטיים"><a href="privacy.html">מדיניות פרטיות</a><a href="terms.html">תנאי שימוש וביטולים</a><a href="accessibility.html">הצהרת נגישות</a></nav></div></footer>
<script>
  // Only this click removes anything: link scanners in SMS apps open the page but never press the button.
  (function () {
    var btn = document.getElementById("optOutBtn");
    var result = document.getElementById("result");
    var token = new URLSearchParams(location.search).get("t") || "";
    btn.addEventListener("click", async function () {
      btn.disabled = true;
      result.textContent = "";
      var removed = false;
      var reason = "לא הצלחנו להשלים את ההסרה. אפשר לנסות שוב בעוד רגע, או להשיב \"הסר\" להודעה.";
      try {
        var res = await fetch("/api/optout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: token }), credentials: "omit", cache: "no-store" });
        removed = res.ok;
        if (res.status === 429) reason = "נשלחו יותר מדי בקשות. אפשר לנסות שוב מאוחר יותר, או להשיב \"הסר\" להודעה.";
      } catch (_) {}
      if (removed) {
        btn.hidden = true;
        document.getElementById("intro").hidden = true;
        result.textContent = "הבקשה התקבלה. אם הקישור תקף, המספר הוסר מהדיוור ולא יקבל עוד הודעות פרסום.";
      } else {
        btn.disabled = false;
        result.textContent = reason;
      }
    });
  })();
</script>
</body>
</html>
